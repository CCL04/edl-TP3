name : Fronted Tests

on :
  push :
    branches : [main]
  pull_request:
    branches : [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps :
      - name : Checkout Code
        uses : actions/checkout@v7
      - uses : actions/setup-node@v7
        with :
          node-version : 24
          cache : 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name : etape
        run : |
          cd fronted
          npm test -- --run
          npm run build