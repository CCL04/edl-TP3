name : Backend Tests

on :
  push :
    branches : [main]
  pull_request:
    branches: [main]

jobs :
  backend:
    runs-on:  ubuntu-latest
    steps :
      - name : Checkout code
        uses : actions/checkout@v7
      - uses : actions/setup-python@v7
        with:
          python-version : '3.11'
          cache: pip
